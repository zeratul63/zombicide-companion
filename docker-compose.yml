services:
  server:
    build: .
    container_name: zombicide-server
    ports:
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./server/saves:/app/server/saves   # ← если бакет монтируется через хостовую папку
    environment:
      - PORT=3001
      - WS_PORT=3002
      - NODE_ENV=production
    restart: unless-stopped